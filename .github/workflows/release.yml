name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux x86-64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.xz
            binary: abyssal-thread

          # Windows x86-64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: abyssal-thread.exe

          # macOS Intel
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.xz
            binary: abyssal-thread

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.xz
            binary: abyssal-thread

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libfontconfig1-dev libfreetype6-dev

      - name: Build
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package Linux/macOS
        if: matrix.archive == 'tar.xz'
        shell: bash
        run: |
          mkdir -p package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" package/
          tar -cJf "abyssal-thread-${{ github.ref_name }}-${{ matrix.target }}.tar.xz" -C package .

      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" package/
          Compress-Archive -Path package/* -DestinationPath "abyssal-thread-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: abyssal-thread-${{ matrix.target }}
          path: abyssal-thread-*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
