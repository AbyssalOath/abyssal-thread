name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: check, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libfontconfig1-dev libfreetype6-dev

      - name: Check
        run: cargo check --workspace

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace --release

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libfontconfig1-dev libfreetype6-dev
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Checks Cargo.lock against the RustSec advisory database
      # (https://rustsec.org) - known-vulnerable or yanked dependency
      # versions fail the build. Worth having specifically here since
      # image import parses untrusted, user-supplied files through the
      # `image` crate - exactly the kind of dependency where a parser
      # vulnerability would actually matter.
      #
      # Ignored advisory IDs and justification live in audit.toml at
      # the repo root; --ignore flags here are the enforcement
      # mechanism since audit.toml alone wasn't being honored in CI.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: >
          cargo audit
          --ignore RUSTSEC-2026-0187
          --ignore RUSTSEC-2024-0388
          --ignore RUSTSEC-2024-0384
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2026-0192
